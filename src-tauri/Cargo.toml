[package]
name = "bengali-ocr"
version = "1.0.0"
description = "Bengali OCR Desktop Application"
authors = ["Bengali OCR Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "dialog-all", "fs-all", "shell-execute", "shell-open", "path-all", "os-all", "updater"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
